name: Nyx daily collection and forecast
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Colombo'
    - cron: '15 6,18 * * *'
      timezone: 'Asia/Colombo'
permissions:
  contents: read
concurrency:
  group: nyx-cloud-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NYX_SOURCE_URL: ${{ secrets.NYX_SOURCE_URL }}
      NYX_START_DRAW: ${{ vars.NYX_START_DRAW }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-job.txt
            requirements-ai.txt
      - name: Install collector dependencies
        run: python -m pip install -r requirements-job.txt
      - name: Install optional CPU PyTorch
        continue-on-error: true
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-ai.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Collect results and generate forecast
        run: python job.py --max-pages 100
